<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cute pixel pomodoro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="window">
        <!-- pomodoro settings -->
        <div id="pomodoro">
            <button class="pomodoro-btn" id="focus-btn">
                <img id="coffee-image" class="pomodoro-icon" src="coffee.png" alt="coffee icon">
                <span class="pomodoro-label">focus</span>
            </button>
            <button class="pomodoro-btn" id="break-btn">
                <img id="cat-image" class="pomodoro-icon" src="cat.png" alt="cat icon">
                <span class="pomodoro-label">short break</span>
            </button>
            <button class="pomodoro-btn" id="long-break-btn">
                <img id="moon-image" class="pomodoro-icon" src="moon.png" alt="moon icon">
                <span class="pomodoro-label">long break</span>
            </button>
        </div>
        <!--title and desc-->
        <div id="timer-info">
            <h1>pomodoro timer</h1>
            <p>welcome to my cute little pomodoro timer app.</p>
            <p>click on the button below to start the timer!</p>
        </div>
        <!--timer itself-->
        <div id="timer">
            <span id="minutes">25</span>:<span id="seconds">00</span>
        </div>
        <!--time's up message-->
        <div id="message"></div>
        <!--timer buttons-->
        <div id="timer-btns">
            <button id="start-btn">start</button>
            <button id="stop-btn">stop</button>
            <button id="reset-btn">reset</button>
        </div>
    </div>


    <script src="script.js"></script>
    <script src="animation.js"></script>
</body>

</html>
