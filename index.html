<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cute pixel pomodoro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="window">
        <!-- window bar -->
        <div id="window-bar">
            <button class="window-btn" id="close-btn">x</button>
            <button class="window-btn" id="minimize-btn">_</button>
            <button class="window-btn" id="maximize-btn">□</button>
        </div>
        <!-- pomodoro settings -->
        <div id="main-content">
            <div id="pomodoro">
                <button class="pomodoro-btn" id="focus-btn">
                    <img id="coffee-image" class="pomodoro-icon" src="coffee1.png" alt="coffee icon">
                    <span class="pomodoro-label">focus</span>
                </button>
                <button class="pomodoro-btn" id="break-btn">
                    <img id="cat-image" class="pomodoro-icon" src="cat1.png" alt="cat icon">
                    <span class="pomodoro-label">short break</span>
                </button>
                <button class="pomodoro-btn" id="long-break-btn">
                    <img id="moon-image" class="pomodoro-icon" src="moon1.png" alt="moon icon">
                    <span class="pomodoro-label">long break</span>
                </button>
            </div>
            <!--title and desc-->
            <div id="timer-info">
                <h1>pomodoro timer</h1>
                <p>welcome to my cute little pomodoro timer app.</p>
                <p>pick a mode to start the timer!</p>
            </div>
        </div>
    </div>
    <div id="timer-window">

        <!--timer itself-->
        <div id="timer">
            <span id="minutes">25</span>:<span id="seconds">00</span>
        </div>
        <!--time's up message-->
        <div id="message"></div>
        <!--timer buttons-->
        <div id="timer-btns">
            <button id="start-btn">start</button>
            <button id="stop-btn">stop</button>
            <button id="reset-btn">reset</button>
        </div>
    </div>

    <button id="reopen-btn">pomodoro</button>

    <script src="script.js"></script>
    <script src="animation.js"></script>
</body>

</html>
