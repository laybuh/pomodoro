<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cute pixel pomodoro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="manifest" href="manifest.json" />
</head>

<body>
    <div id="window">
        <!-- window bar -->
        <div id="window-bar">
            <span class="window-txt">pomodoro</span>
            <!-- window buttons -->
            <div class="window-btns">
                <button class="window-btn" id="close-btn">x</button>
                <button class="window-btn" id="minimize-btn">_</button>
            </div>
        </div>
        <!-- pomodoro settings -->
        <div id="main-content">
            <div id="pomodoro">
                <button class="pomodoro-btn" id="focus-btn">
                    <img id="coffee-image" class="pomodoro-icon" src="coffee1.png" alt="coffee icon">
                    <span class="pomodoro-label">focus</span>
                </button>
                <button class="pomodoro-btn" id="break-btn">
                    <img id="cat-image" class="pomodoro-icon" src="cat1.png" alt="cat icon">
                    <span class="pomodoro-label">short break</span>
                </button>
                <button class="pomodoro-btn" id="long-break-btn">
                    <img id="moon-image" class="pomodoro-icon" src="moon1.png" alt="moon icon">
                    <span class="pomodoro-label">long break</span>
                </button>
            </div>
            <!--title and desc-->
            <div id="timer-info">
                <h1>pomodoro timer</h1>
                <p>pick a timer to begin</p>
            </div>
        </div>
    </div>
    <div id="timer-window" hidden>
        <!--timer window bar-->
        <div id="timer-window-bar">
            <span class="window-txt">timer</span>
            <div class="window-btns">
                <button class="window-btn" id="timer-close-btn">x</button>
                <button class="window-btn" id="timer-minimize-btn">_</button>
            </div>
        </div>
        <!--timer image-->
        <img id="timer-image" class="timer-art" src="coffee1.png" alt="timer image">
        <!--timer itself-->
        <div id="timer">
            <span id="minutes">25</span>:<span id="seconds">00</span>
        </div>
        <!--time's up message-->
        <div id="message"></div>
        <!--timer buttons-->
        <div id="timer-btns">
            <button id="start-btn">start</button>
            <button id="stop-btn">stop</button>
            <button id="reset-btn">reset</button>
        </div>
    </div>

    <button id="reopen-btn" class="desktop-icon">
        <img src="folder1.png" alt="folder image">
        <span class="desktop-txt">pomodoro</span>
    </button>

    <script src="script.js"></script>
    <script src="animation.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("pwabuilder-sw.js");
        }
    </script>
</body>

</html>
